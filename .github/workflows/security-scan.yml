name: Secrets Detection Scan

on:
  push:
    branches:
      - "**"

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create Simulated Leak for CI Testing
        run: |
          # Creates a test file dynamically inside runner so GitHub Push Protection doesn't block git push
          echo 'AWS_KEY="AKIAIOSFODNN7EXAMPLE"' > live_leak_test.py

      - name: Run Secret Scanner
        run: |
          python Scanner.py . --format table
          SCAN_STATUS=$?

          python Scanner.py . --format json > scan_report.json

          if [ $SCAN_STATUS -ne 0 ]; then
            echo "::error::Hardcoded credentials detected! Build flagged as failed."
            exit 1
          fi

      - name: Archive JSON Findings Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: scan_report.json