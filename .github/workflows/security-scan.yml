name: Secrets Detection Scan

on:
  push:
    branches:
      - "**"  # Runs on every push to any branch

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run Secret Scanner
        run: |
          # 1. Run the scan once and save the output directly to JSON
              python Scanner.py . --format json > scan_report.json || true

          # 2. Print human-readable output to console
            python Scanner.py . --format table
          SCAN_STATUS=$?

          # 3. Fail the job if secrets were detected
          if [ $SCAN_STATUS -ne 0 ]; then
            echo "::error::Hardcoded credentials detected! Build flagged as failed."
            exit 1
          fi

      - name: Archive JSON Findings Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: scan_report.json
