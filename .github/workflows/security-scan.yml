name: Secrets Detection Scan

on:
  push:
    branches:
      - "**"  # Runs on every push to any branch

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Secret Scanner
        run: |
          # Run scanner: prints human-readable table to runner console
          python Scanner.py . --format table
          
          # Capture scanner exit code (0 = clean, 1 = secret found)
          SCAN_STATUS=$?

          # Also save full JSON report for inspection
          python Scanner.py . --format json > scan_report.json

          # Fail the job if secrets were detected
          if [ $SCAN_STATUS -ne 0 ]; then
            echo "::error::Hardcoded credentials detected! Build flagged as failed."
            exit 1
          fi

      - name: Archive JSON Findings Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: scan_report.json